server:
  port: 8083

spring:
  application:
    name: subscription-service
  datasource:
    url: jdbc:mysql://localhost:3306/pulsefit_subscription?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}
    hostname: localhost
    prefer-ip-address: false
    status-page-url-path: /swagger-ui/index.html
    home-page-url-path: /

jwt:
  secret: ${JWT_SECRET:PulseFitSuperSecretKeyForJWTHMACSHA256EnterpriseSecurity2024!}

