server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    loadbalancer:
      cache:
        ttl: 2s
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # 1. Auth Service Routes (Public, no JWT filter)
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        # 2. Member Service Routes (Protected with JWT filter)
        - id: member-service
          uri: lb://MEMBER-SERVICE
          predicates:
            - Path=/api/members/**
          filters:
            - name: JwtAuthenticationFilter

        # 3. Subscription Service Routes (Protected with JWT filter)
        - id: subscription-service
          uri: lb://SUBSCRIPTION-SERVICE
          predicates:
            - Path=/api/subscriptions/**
          filters:
            - name: JwtAuthenticationFilter

        # 3b. Membership Plans Routes (Protected with JWT filter - routes to Subscription Service)
        - id: subscription-plans-service
          uri: lb://SUBSCRIPTION-SERVICE
          predicates:
            - Path=/api/plans/**
          filters:
            - name: JwtAuthenticationFilter

        # 4. Attendance Service Routes (Protected with JWT filter)
        - id: attendance-service
          uri: lb://ATTENDANCE-SERVICE
          predicates:
            - Path=/api/attendance/**
          filters:
            - name: JwtAuthenticationFilter

        # 5. OpenAPI Specs Routing for Centralized Gateway Swagger UI
        - id: auth-docs
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/v3/api-docs/auth-service
          filters:
            - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

        - id: member-docs
          uri: lb://MEMBER-SERVICE
          predicates:
            - Path=/v3/api-docs/member-service
          filters:
            - RewritePath=/v3/api-docs/member-service, /v3/api-docs

        - id: subscription-docs
          uri: lb://SUBSCRIPTION-SERVICE
          predicates:
            - Path=/v3/api-docs/subscription-service
          filters:
            - RewritePath=/v3/api-docs/subscription-service, /v3/api-docs

        - id: attendance-docs
          uri: lb://ATTENDANCE-SERVICE
          predicates:
            - Path=/v3/api-docs/attendance-service
          filters:
            - RewritePath=/v3/api-docs/attendance-service, /v3/api-docs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 1. Auth Service (:8081 via Gateway)
        url: /v3/api-docs/auth-service
      - name: 2. Member Service (:8082 via Gateway)
        url: /v3/api-docs/member-service
      - name: 3. Subscription Service (:8083 via Gateway)
        url: /v3/api-docs/subscription-service
      - name: 4. Attendance Service (:8084 via Gateway)
        url: /v3/api-docs/attendance-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 3
  instance:
    instance-id: ${spring.application.name}:${server.port}
    hostname: localhost
    prefer-ip-address: false
    status-page-url-path: /swagger-ui.html
    home-page-url-path: /

jwt:
  secret: ${JWT_SECRET:PulseFitSuperSecretKeyForJWTHMACSHA256EnterpriseSecurity2024!}
